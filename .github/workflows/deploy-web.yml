name: Deploy web (EAS Hosting)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx expo export -p web
        env:
          # the API on Railway; override with repo Settings → Variables → SEYO_API_URL (e.g. a custom domain)
          EXPO_PUBLIC_API_URL: ${{ vars.SEYO_API_URL || 'https://api-production-3eebbba7.up.railway.app' }}

      - run: npx --yes eas-cli@latest deploy --prod --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
